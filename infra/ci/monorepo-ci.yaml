# Outline Plan:
# 1. Trigger pipeline on pushes or PRs targeting dev, staging, or main.
# 2. Spin up an active Ubuntu container, caching pnpm storage layers.
# 3. Use Turborepo Affected flags to dynamically scale tasks based on changed file paths.
# 4. Enforce separate linting and testing rules across TypeScript, Python, and Solidity layers.

name: GameFund Monorepo CI Pipeline

on:
  push:
    branches: [main, staging, dev]
    pull_request: 
      branches: [main, staging, dev]

  jobs:
    quality-assurance:
      name: Lint, Test & Verify Monorepo
      runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # deep fetch history for turborepo
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Python Environment (Fast API)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Global Python Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # Enforce style checks
      - name: Enforce Code Style & Lint
        run: pnpm turbo lint

      # Executes targeted unit testing blocks using Turborepo dependency graphing
      - name: Run Workspace Test Matrix
        run: pnpm turbo test